<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Ayudante de Séneca</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Ayudante de Séneca</h1>
    <p id="estado" aria-live="polite"></p>
  </header>

  <p id="aviso" class="aviso" hidden></p>

  <nav id="menu" hidden aria-label="Utilidades">
    <section aria-labelledby="informes">
      <h2 id="informes">Informes</h2>
      <button id="alumnado" class="tarea">
        Alumnado
        <span id="alumnado-nota" class="nota">Elige «Grupo - Materia» de tu
        pantalla de Séneca.</span>
      </button>

      <p id="alumnado-cargando" class="cargando" aria-live="polite" hidden></p>
      <div id="alumnado-avisos" class="avisos" hidden></div>
      <p id="alumnado-error" class="error" role="alert" hidden></p>
      <button id="alumnado-reintentar" class="secundario" type="button" hidden>
        Reintentar
      </button>
      <div id="alumnado-lista" class="grupos" role="group" aria-label="Tus grupos de Séneca" hidden></div>
      <p id="alumnado-vacio" class="vacio" hidden></p>
      <p id="alumnado-seleccion" class="seleccion" aria-live="polite" hidden></p>
    </section>
    <section aria-labelledby="diagnostico-titulo">
      <h2 id="diagnostico-titulo">Diagnóstico</h2>
      <button id="diagnostico" class="tarea">
        Probar conexión con «Grupos de alumnos/as»
        <span class="nota">El resultado solo se muestra aquí; no se envía a
        ningún sitio.</span>
      </button>
      <pre id="diagnostico-salida" class="diagnostico" aria-live="polite" hidden></pre>
    </section>
  </nav>

  <footer>
    <p>Herramienta independiente, sin relación oficial con la Consejería de
    Educación de la Junta de Andalucía. Nada sale de tu navegador.</p>
  </footer>

  <script src="diagnostico-analisis.js"></script>
  <script src="seneca/peticion.js"></script>
  <script src="seneca/grupos-alumnos.js"></script>
  <script src="alumnado-vista.js"></script>
  <script src="diagnostico.js"></script>
  <script src="popup.js"></script>
</body>
</html>
